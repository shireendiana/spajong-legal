<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Spajong</title>

<!-- The reset page now lives at https://spajong.app/reset-password, and Supabase
     is configured to send new recovery links there. This page is kept as a
     forwarder for links in emails that were ALREADY SENT before that change:
     a recovery link stays valid for a while after it is issued, and deleting
     this page would strand anyone who clicks one.

     It must NOT verify the token itself -- it only hands the recovery
     parameters on. Those arrive as a query string (?token_hash=...&type=recovery),
     so a <meta http-equiv="refresh"> is not usable here: it would forward to a
     bare URL and drop them, turning a working reset link into an error page.
     The fragment is carried too, in case an implicit-flow link arrives. -->
<link rel="canonical" href="https://spajong.app/reset-password">
<meta name="robots" content="noindex">
<style>
  body {
    background: #FAF8F5;
    color: #1C1917;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 16px;
    line-height: 1.7;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 680px; margin: 0 auto; padding: 96px 24px; text-align: center; }
  .eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: #C4A882; margin-bottom: 12px;
  }
  h1 { font-size: 28px; font-weight: 400; margin: 0 0 16px; }
  p { color: #6B6560; margin: 0 0 14px; }
  a { color: #1C1917; }
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">Spajong</div>
  <h1>Taking you to the reset page</h1>
  <p>Password reset has moved to <strong>spajong.app</strong>. You should be redirected automatically.</p>
  <p id="manual"></p>
</div>
<script>
  (function () {
    var target = "https://spajong.app/reset-password"
      + window.location.search
      + window.location.hash;

    // Offer the link before redirecting, so a blocked or failed navigation still
    // leaves the recovery parameters reachable rather than losing them.
    var manual = document.getElementById("manual");
    var a = document.createElement("a");
    a.href = target;
    a.textContent = "Continue to reset your password";
    manual.appendChild(a);

    window.location.replace(target);
  })();
</script>
</body>
</html>
